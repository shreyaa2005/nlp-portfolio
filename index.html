var L={en:{fo:"Don’t forget to open",pp:"That team’s project idea was so different that I got really into that project.",ik:"NLP · a class told in stars",in1:"Seven stars. One small story. For ma’am.",in2:"Enter the sky",bi:"That bigram class was so much fun, and such an interesting topic.",fs:"I had forgotten Tamil grammar for a long time. This task made me open it again, and it reminded me of school.",trl:"Every Tamil poem and piece of literature gives a deeply touching meaning. I love reading them. Thank you for this hands-on session.",ho:"I love attending hands-on sessions. They make me excited. I am not a theory person. I love to implement, and your class gave me that. I did every single hands-on session.",ti:"Shreya’s NLP Sky",su:"7 stars earned · tap every glowing thing",pr:"explored",lk:"Explore all 8 to unlock the envelope ✉",rd:"All done! Tap the envelope",tp:"✉ Tap to open",mo:"Hands-on Session",ro:"Translation",al:"Amazon ML Challenge",st:"Stars earned",wy:"This star reminds me of the effort I put in and what I understood in this part of NLP.",w3:"Three stars for one topic. This is where I gave my best.",hi:"We coded NLP ideas ourselves: a word cloud, name-based gender classification and text similarity.",gh:"See the code on GitHub",tn:"The line shows the first meeting of Rama and Sita. Both look at each other and love begins. The Tamil is poetic. The English is plain, but correct and natural.",am:"My mind really widened after you shared the idea. Thank you for the guidance.",lt:"Hello ma’am, this is Shreya. I don’t think you can recognise my name. You may wonder why this girl got only 7 stars. Maybe it is because I don’t speak confidently in class, and my voice may not have reached you many times. But by the end of the NLP class, I began to raise my hand and share my answers and thoughts. A girl who never raised her hand, and then did, is a big star for me. Beyond the syllabus, I learnt many new things. One of them is how to look at a problem and think it through before stepping into it.",sg:"Shreya"},
ta:{fo:"திறக்க மறக்காதீர்கள்",pp:"அந்தக் குழுவின் திட்ட யோசனை மிகவும் வித்தியாசமாக இருந்தது. அதனால் நான் அந்தத் திட்டத்தில் முழுமையாக மூழ்கிவிட்டேன்.",ik:"NLP · நட்சத்திரங்களில் ஒரு வகுப்பு",in1:"ஏழு நட்சத்திரங்கள். ஒரு சிறிய கதை. மேடத்திற்காக.",in2:"வானத்திற்குள் நுழையுங்கள்",bi:"அந்த பைகிராம் வகுப்பு மிகவும் ஜாலியாகவும் சுவாரசியமாகவும் இருந்தது.",fs:"தமிழ் இலக்கணத்தை நீண்ட நாட்களாக மறந்திருந்தேன். இந்தப் பணிக்காக மீண்டும் திறந்தேன். அது எனக்குப் பள்ளி நாட்களை நினைவூட்டியது.",trl:"ஒவ்வொரு தமிழ் இலக்கியமும் கவிதையும் மனதைத் தொடும் பொருளைத் தருகிறது. அவற்றைப் படிப்பது எனக்குப் பிடிக்கும். இந்த நேரடிப் பயிற்சிக்கு நன்றி.",ho:"நேரடிப் பயிற்சி அமர்வுகளுக்கு வருவது எனக்குப் பிடிக்கும். அவை என்னை உற்சாகப்படுத்துகின்றன். நான் கோட்பாட்டு ஆள் அல்ல. செய்து பார்ப்பது எனக்குப் பிடிக்கும். உங்கள் வகுப்பில் அது கிடைத்தது. ஒவ்வொரு நேரடிப் பயிற்சியையும் நான் செய்தேன்.",ti:"ஷ்ரேயாவின் NLP வானம்",su:"7 நட்சத்திரங்கள் · ஒவ்வொன்றையும் தொடுங்கள்",pr:"பார்த்தவை",lk:"8-ஐயும் பார்த்தால் கடிதம் திறக்கும் ✉",rd:"முடிந்தது! உறையைத் தொடுங்கள்",tp:"✉ திறக்கத் தொடுங்கள்",mo:"நேரடிப் பயிற்சி",ro:"மொழிபெயர்ப்பு",al:"அமேசான் ML சேலஞ்ச்",st:"பெற்ற நட்சத்திரங்கள்",wy:"NLP-யின் இந்தப் பகுதியில் நான் போட்ட உழைப்பையும் புரிதலையும் இந்த நட்சத்திரம் நினைவூட்டுகிறது.",w3:"ஒரே தலைப்புக்கு மூன்று நட்சத்திரங்கள். இங்கே என் முழு முயற்சியைக் கொடுத்தேன்.",hi:"வார்த்தை மேகம், பெயரால் பாலினம் கண்டறிதல், உரை ஒற்றுமை ஆகியவற்றை நாங்களே குறியிட்டோம்.",gh:"GitHub-இல் குறியீட்டைப் பார்க்க",tn:"இந்த வரி ராமனும் சீதையும் முதன்முறை சந்திப்பதைக் காட்டுகிறது. இருவரும் பார்க்கிறார்கள், காதல் தொடங்குகிறது. தமிழ் கவிதை நயம் கொண்டது. ஆங்கிலம் எளிமையானது, சரியானது, இயல்பானது.",am:"நீங்கள் அந்த யோசனையைச் சொன்ன பிறகு என் சிந்தனை உண்மையிலேயே விரிந்தது. வழிகாட்டுதலுக்கு நன்றி.",lt:"வணக்கம் மேடம், நான் ஷ்ரேயா. என் பெயர் உங்களுக்கு நினைவிருக்காது என்று நினைக்கிறேன். இந்தப் பெண்ணுக்கு ஏன் 7 நட்சத்திரங்கள் மட்டும் என்று நீங்கள் நினைக்கலாம். நான் வகுப்பில் தன்னம்பிக்கையுடன் பேசுபவள் அல்ல, என் குரல் உங்களை அடிக்கடி எட்டாமல் இருந்திருக்கலாம். ஆனால் NLP வகுப்பின் இறுதியில் நான் கை உயர்த்தி பதில்களையும் எண்ணங்களையும் பகிர ஆரம்பித்தேன். கை உயர்த்தாத பெண் கை உயர்த்தியது எனக்குப் பெரிய நட்சத்திரம். பாடத்திட்டத்திற்கு அப்பாலும் நிறைய கற்றேன். ஒரு பிரச்சனையில் இறங்கும் முன் அதைப் பார்த்து யோசிப்பது அவற்றில் ஒன்று.",sg:"ஷ்ரேயா"},
hi:{fo:"खोलना मत भूलिए",pp:"उस टीम का प्रोजेक्ट आइडिया बहुत अलग था, इसलिए मैं उस प्रोजेक्ट में पूरी तरह डूब गई।",ik:"NLP · तारों में सजी एक क्लास",in1:"सात तारे। एक छोटी कहानी। मैम के लिए।",in2:"आसमान में प्रवेश करें",bi:"वह बाइग्राम क्लास बहुत मज़ेदार और दिलचस्प थी।",fs:"मैं काफ़ी समय से तमिल व्याकरण भूल गई थी। इस काम के लिए मैंने उसे फिर खोला, और स्कूल के दिन याद आ गए।",trl:"हर तमिल साहित्य और कविता का अर्थ दिल को छू लेने वाला होता है। मुझे उन्हें पढ़ना पसंद है। इस हैंड्स-ऑन सेशन के लिए धन्यवाद।",ho:"मुझे हैंड्स-ऑन सेशन में आना बहुत पसंद है। वे मुझे उत्साहित करते हैं। मैं थ्योरी वाली इंसान नहीं हूँ। मुझे खुद करके देखना पसंद है, और आपकी क्लास में मुझे वह मिला। मैंने हर एक हैंड्स-ऑन सेशन किया।",ti:"श्रेया का NLP आसमान",su:"7 तारे · हर चमकती चीज़ को छुएँ",pr:"देखे",lk:"सभी 8 देखें, तब लिफ़ाफ़ा खुलेगा ✉",rd:"हो गया! लिफ़ाफ़े को छुएँ",tp:"✉ खोलने के लिए छुएँ",mo:"हैंड्स-ऑन सेशन",ro:"अनुवाद",al:"अमेज़न ML चैलेंज",st:"मिले तारे",wy:"यह तारा NLP के इस हिस्से में मेरी मेहनत और समझ की याद दिलाता है।",w3:"एक ही विषय के लिए तीन तारे। यहाँ मैंने अपना सबसे अच्छा दिया।",hi:"हमने खुद NLP के विचार कोड किए: वर्ड क्लाउड, नाम से लिंग पहचान और टेक्स्ट समानता।",gh:"GitHub पर कोड देखें",tn:"यह पंक्ति राम और सीता की पहली भेंट दिखाती है। दोनों एक-दूसरे को देखते हैं और प्रेम शुरू होता है। तमिल पंक्ति काव्यात्मक है। अंग्रेज़ी सरल, सही और स्वाभाविक है।",am:"आपके विचार साझा करने के बाद मेरी सोच सच में बड़ी हो गई। मार्गदर्शन के लिए धन्यवाद।",lt:"नमस्ते मैम, मैं श्रेया हूँ। शायद आप मेरा नाम न पहचानें। आप सोच सकती हैं कि इस लड़की को सिर्फ़ 7 तारे क्यों मिले। शायद इसलिए कि मैं क्लास में आत्मविश्वास से नहीं बोलती, और मेरी आवाज़ आप तक कई बार नहीं पहुँची। लेकिन NLP क्लास के अंत तक मैंने हाथ उठाना और अपने जवाब और विचार बताना शुरू कर दिया। जो लड़की कभी हाथ नहीं उठाती थी और फिर उठाने लगी, वह मेरे लिए एक बड़ा तारा है। सिलेबस से आगे भी मैंने बहुत कुछ नया सीखा। उनमें से एक है किसी समस्या में उतरने से पहले उसे देखना और सोचना।",sg:"श्रेया"},
te:{fo:"తెరవడం మర్చిపోకండి",pp:"ఆ టీమ్ ప్రాజెక్ట్ ఐడియా చాలా విభిన్నంగా ఉంది, అందుకే నేను ఆ ప్రాజెక్ట్‌లో పూర్తిగా లీనమయ్యాను.",ik:"NLP · నక్షత్రాలలో ఒక క్లాస్",in1:"ఏడు నక్షత్రాలు. ఒక చిన్న కథ. మేడమ్ కోసం.",in2:"ఆకాశంలోకి ప్రవేశించండి",bi:"ఆ బైగ్రామ్ క్లాస్ చాలా సరదాగా, ఆసక్తికరంగా ఉంది.",fs:"చాలా కాలంగా తమిళ వ్యాకరణం మర్చిపోయాను. ఈ పని కోసం మళ్లీ తెరిచాను, స్కూల్ రోజులు గుర్తుకొచ్చాయి.",trl:"ప్రతి తమిళ సాహిత్యం, కవిత హృదయాన్ని తాకే అర్థాన్ని ఇస్తుంది. వాటిని చదవడం నాకు ఇష్టం. ఈ హ్యాండ్స్-ఆన్ సెషన్‌కి ధన్యవాదాలు.",ho:"హ్యాండ్స్-ఆన్ సెషన్లకు హాజరవడం నాకు చాలా ఇష్టం. అవి నన్ను ఉత్సాహపరుస్తాయి. నేను థియరీ మనిషిని కాదు. చేసి చూడటం నాకు ఇష్టం, మీ క్లాస్‌లో అది దొరికింది. ప్రతి హ్యాండ్స్-ఆన్ సెషన్ నేను చేశాను.",ti:"శ్రేయ NLP ఆకాశం",su:"7 నక్షత్రాలు · ప్రతిదాన్నీ తాకండి",pr:"చూసినవి",lk:"8 చూస్తే కవరు తెరుచుకుంటుంది ✉",rd:"అయిపోయింది! కవరును తాకండి",tp:"✉ తెరవడానికి తాకండి",mo:"హ్యాండ్స్-ఆన్ సెషన్",ro:"అనువాదం",al:"అమెజాన్ ML ఛాలెంజ్",st:"పొందిన నక్షత్రాలు",wy:"NLP లోని ఈ భాగంలో నేను పెట్టిన కృషిని, అర్థం చేసుకున్నదాన్ని ఈ నక్షత్రం గుర్తు చేస్తుంది.",w3:"ఒకే అంశానికి మూడు నక్షత్రాలు. ఇక్కడ నా వంతు ఉత్తమంగా చేశాను.",hi:"మేమే NLP ఆలోచనలను కోడ్ చేశాం: వర్డ్ క్లౌడ్, పేరు ఆధారంగా లింగ గుర్తింపు, టెక్స్ట్ సారూప్యత.",gh:"GitHub లో కోడ్ చూడండి",tn:"ఈ వాక్యం రాముడు, సీత మొదటిసారి కలవడాన్ని చూపుతుంది. ఇద్దరూ ఒకరినొకరు చూస్తారు, ప్రేమ మొదలవుతుంది. తమిళం కవితాత్మకం. ఇంగ్లీష్ సరళం, సరైనది, సహజం.",am:"మీరు ఆ ఆలోచన చెప్పిన తర్వాత నా ఆలోచన నిజంగా విస్తరించింది. మార్గదర్శనానికి ధన్యవాదాలు.",lt:"నమస్తే మేడమ్, నేను శ్రేయ. నా పేరు మీరు గుర్తుపట్టరని అనుకుంటున్నాను. ఈ అమ్మాయికి ఎందుకు 7 నక్షత్రాలే అని మీరు అనుకోవచ్చు. నేను క్లాస్‌లో ధైర్యంగా మాట్లాడను, నా గొంతు మీకు చాలాసార్లు వినిపించకపోవచ్చు. కానీ NLP క్లాస్ చివరికి నేను చెయ్యి ఎత్తి నా సమాధానాలు, ఆలోచనలు చెప్పడం మొదలుపెట్టాను. చెయ్యి ఎత్తని అమ్మాయి చెయ్యి ఎత్తడం నాకు పెద్ద నక్షత్రం. సిలబస్ కాకుండా కూడా చాలా నేర్చుకున్నాను. సమస్యలోకి దిగే ముందు దాన్ని చూసి ఆలోచించడం వాటిలో ఒకటి.",sg:"శ్రేయ"},
